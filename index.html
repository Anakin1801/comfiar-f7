<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Comfiar F7 · Centro de mando del torneo</title>
<meta name="theme-color" content="#0b1410">
<meta name="description" content="Centro de mando del equipo de Fútbol 7 de Comfiar">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Comfiar F7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>try{ if(localStorage.getItem('comfiar_theme')==='light') document.documentElement.dataset.theme='light'; }catch(e){}</script>
<style>
:root{
  --bg:#0b1410;--panel:#121f19;--panel2:#18291f;--line:#24392d;--txt:#e8f1ec;--mut:#8fa89a;
  --acc:#d4f53c;--acc2:#38d39f;--warn:#ff9f43;--bad:#ff5d5d;--vet:#7cc4ff;
  --grass1:#1d6b3a;--grass2:#1a6235;
  --hdr:rgba(11,20,16,.94);--navbg:rgba(18,31,25,.97);--desc:#c4d3ca;--onacc:#14200a;
  --c80:#d4f53c;--c65:#38d39f;--c50:#ff9f43;--c0:#ff5d5d;
}
:root[data-theme=light]{
  --bg:#eef2ec;--panel:#ffffff;--panel2:#f1f5ef;--line:#d3ddd4;--txt:#10201a;--mut:#56695e;
  --acc:#3b7a10;--acc2:#0b8a5f;--warn:#b85a00;--bad:#c62828;--vet:#1565c0;
  --hdr:rgba(238,242,236,.96);--navbg:rgba(255,255,255,.97);--desc:#2f4237;--onacc:#ffffff;
  --c80:#4f9a12;--c65:#0b9a69;--c50:#d97706;--c0:#c62828;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.45 Inter,system-ui,sans-serif}
h1,h2,h3,.cond{font-family:"Barlow Condensed",Inter,sans-serif;letter-spacing:.3px}
header{position:sticky;top:0;z-index:20;background:var(--hdr);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hwrap{max-width:1180px;margin:0 auto;padding:12px 16px 0;display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 24px}
.brand h1{margin:0;font-size:26px;line-height:1;text-transform:uppercase}
.brand h1 span{color:var(--acc)}
.brand p{margin:3px 0 10px;color:var(--mut);font-size:12px}
nav{display:flex;gap:2px;overflow-x:auto}
nav button{background:none;border:0;color:var(--mut);font:700 15px "Barlow Condensed";text-transform:uppercase;letter-spacing:.6px;padding:10px 14px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--txt);border-color:var(--acc)}
nav button i{display:none;font-style:normal}
body.viewer nav button[data-v="cambios"]{display:none}
.hact{margin:0 0 10px auto;align-self:center;display:flex;gap:6px}
#dtbtn.on{border-color:var(--acc);color:var(--acc)}
main{max-width:1180px;margin:0 auto;padding:18px 16px 60px}
section{display:none}section.on{display:block}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ctl{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
select,input[type=text],input[type=date],input[type=time],input[type=number],input[type=email],input[type=password],textarea{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit}
textarea{width:100%;resize:vertical;min-height:64px}
.btn{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:9px 14px;font:600 13px Inter;cursor:pointer}
.btn:hover{border-color:var(--mut)}
.btn.pri{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.sel{outline:2px solid var(--acc);outline-offset:1px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.mut{color:var(--mut)}
.tag{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:99px;text-transform:uppercase;letter-spacing:.4px}
.t-vet{background:rgba(124,196,255,.15);color:var(--vet)}
.t-tired{background:rgba(255,159,67,.15);color:var(--warn)}
.t-pos{background:rgba(127,160,40,.15);color:var(--acc)}
.t-edit{background:rgba(56,211,159,.15);color:var(--acc2)}
.t-bad{background:rgba(255,93,93,.14);color:var(--bad)}
.grid{display:grid;gap:14px}
/* plantilla */
.pgrid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.pc{position:relative;overflow:hidden}
.pc .top{display:flex;gap:12px;align-items:flex-start}
.ovr{font:800 44px/0.9 "Barlow Condensed";color:var(--acc)}
.pc h3{margin:0;font-size:24px;line-height:1;text-transform:uppercase}
.pc h3 small{font-size:16px;color:var(--mut);margin-left:4px}
.pc .meta{font-size:12px;color:var(--mut);margin:3px 0 6px}
.pc .body{display:flex;gap:10px;align-items:center;margin-top:8px}
.pc .edit{position:absolute;top:12px;right:12px}
.pc .chev{display:none}
.bars{flex:1;display:grid;gap:3px}
.bar{display:grid;grid-template-columns:28px 1fr 24px;gap:6px;align-items:center;font-size:11px;color:var(--mut)}
.bar i{display:block;height:6px;border-radius:3px;background:var(--line);position:relative;overflow:hidden}
.bar i b{position:absolute;inset:0 auto 0 0;border-radius:3px}
.bar span:last-child{color:var(--txt);text-align:right;font-weight:600}
.pc .desc{font-size:12.5px;color:var(--desc);margin:10px 0 0;border-top:1px dashed var(--line);padding-top:8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi .v{font:800 34px/1 "Barlow Condensed"}
.kpi .l{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
/* cancha */
.two{display:grid;grid-template-columns:minmax(300px,440px) 1fr;gap:18px;align-items:start}
@media(max-width:820px){.two{grid-template-columns:1fr}}
.pitch{position:relative;aspect-ratio:2/3;border-radius:14px;overflow:hidden;
  background:repeating-linear-gradient(0deg,var(--grass1) 0 10%,var(--grass2) 10% 20%);border:2px solid #2c8a4d}
.pitch .mk{position:absolute;border:2px solid rgba(255,255,255,.35)}
.slot{position:absolute;transform:translate(-50%,-50%);width:86px;text-align:center;cursor:pointer}
.slot .dot{width:52px;height:52px;margin:0 auto;border-radius:50%;background:#0d1a13;border:2px solid #d4f53c;display:flex;align-items:center;justify-content:center;font:800 20px "Barlow Condensed";color:#d4f53c;box-shadow:0 4px 12px rgba(0,0,0,.4);position:relative}
.slot.vet .dot{border-color:#7cc4ff;color:#7cc4ff}
.slot.empty .dot{border-style:dashed;color:#8fa89a;border-color:#8fa89a}
.slot .nm{margin-top:4px;font:700 14px/1 "Barlow Condensed";text-transform:uppercase;background:rgba(0,0,0,.55);color:#fff;padding:3px 6px;border-radius:5px;display:inline-block}
.slot .rl{font-size:10px;color:#e3efe7;margin-top:2px;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.slot .en{height:4px;width:46px;margin:3px auto 0;background:rgba(0,0,0,.5);border-radius:2px;overflow:hidden}
.slot .en b{display:block;height:100%}
.slot .vb{position:absolute;top:-4px;right:-6px;background:#7cc4ff;color:#0b1410;font:800 10px Inter;border-radius:99px;padding:1px 4px}
.slot .gb{position:absolute;top:-6px;left:-8px;background:#fff;color:#0b1410;font:800 11px Inter;border-radius:99px;padding:1px 5px}
.rule{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-weight:600;margin:12px 0}
.rule.ok{background:rgba(56,211,159,.12);color:var(--acc2)}
.rule.ko{background:rgba(255,93,93,.12);color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel2);color:var(--txt);border-radius:99px;padding:5px 11px;font-size:12.5px;cursor:pointer}
.chip.off{opacity:.4;text-decoration:line-through}
.chip.lock{opacity:.55;cursor:default}
.chip.vet{border-color:rgba(124,196,255,.5)}
.chip.si{border-color:var(--acc2);color:var(--acc2)}
.chip.no{border-color:var(--bad);color:var(--bad)}
table{width:100%;border-collapse:collapse}
th,td{padding:7px 8px;text-align:left;border-bottom:1px solid var(--line);font-size:13px}
th{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.lines{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.lines div{background:var(--panel2);border-radius:10px;padding:8px 10px}
.lines b{display:block;font:800 26px/1 "Barlow Condensed"}
.lines span{font-size:11px;color:var(--mut);text-transform:uppercase}
/* próximo partido / en vivo */
.nextc{margin-bottom:14px;border-color:rgba(127,160,40,.45)}
.nextc h3{margin:2px 0 0;font-size:26px;text-transform:uppercase;line-height:1}
.att{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.att .yn{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.att .yn .btn{padding:12px;font-size:15px}
.att .yn .btn.si.sel{background:var(--acc2);color:#04140d;border-color:var(--acc2)}
.att .yn .btn.no.sel{background:var(--bad);color:#fff;border-color:var(--bad)}
.att .grp{font-size:12px;color:var(--mut);margin-top:6px}
.livebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;padding:10px 14px;border-radius:12px;background:rgba(255,93,93,.1);border:1px solid rgba(255,93,93,.35)}
.livebar b{font:800 22px "Barlow Condensed"}
.dotlive{width:9px;height:9px;border-radius:50%;background:var(--bad);animation:pul 1.4s infinite}
@keyframes pul{50%{opacity:.25}}
.livec{margin-bottom:14px}
.livec.on{border-color:rgba(255,93,93,.5)}
.sbig{display:grid;grid-template-columns:1fr auto auto auto 1fr;align-items:center;gap:10px;margin:6px 0 10px;font-family:"Barlow Condensed"}
.sbig span{font-weight:700;font-size:18px;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbig span:first-child{text-align:right}
.sbig b{font-size:52px;line-height:1}
.sbig i{font-style:normal;font-size:30px;color:var(--mut)}
.lbtn{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}
.lbtn .btn{padding:12px 8px}
.evs{margin-top:10px;display:grid;gap:4px}
.ev{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;padding:6px 8px;background:var(--panel2);border-radius:8px}
.ev button{background:none;border:0;color:var(--mut);font-size:18px;cursor:pointer;padding:0 4px}
.actg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.actg .btn{padding:16px 8px;font-size:16px}
/* cambios */
.erow{display:grid;grid-template-columns:110px 1fr 40px;gap:8px;align-items:center;padding:4px 0}
.erow input[type=range]{width:100%;accent-color:var(--acc)}
.sug{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin-bottom:8px}
.sug .d{font:800 26px/1 "Barlow Condensed";color:var(--acc2);min-width:58px;text-align:center}
.sug .t{flex:1}
.sug .t b{font-family:"Barlow Condensed";font-size:17px;text-transform:uppercase}
.out{color:var(--bad)}.in{color:var(--acc2)}
.why{font-size:12px;color:var(--mut);margin-top:2px}
.bestnow{display:none}
/* torneo: contadores – / + */
.mrows{display:grid;gap:8px;margin-top:10px}
.mrow{background:var(--panel2);border-radius:10px;padding:8px 10px}
.mrow .hd{display:flex;align-items:center;gap:10px;font-weight:600}
.mrow .hd input{width:20px;height:20px;accent-color:var(--acc)}
.mrow .cnt{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px;margin-top:6px}
.stp{display:flex;align-items:center;justify-content:space-between;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px 4px 3px 8px;font-size:13px}
.stp button{width:34px;height:32px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);font:700 18px Inter;cursor:pointer}
.stp b{min-width:22px;text-align:center;font:800 20px "Barlow Condensed"}
.stp.big{font-size:12px;text-transform:uppercase;color:var(--mut)}
.stp.big b{font-size:28px;color:var(--txt)}
.mline{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:10px}
.score{font:800 22px "Barlow Condensed"}
.res-W{color:var(--acc2)}.res-D{color:var(--warn)}.res-L{color:var(--bad)}
.note{font-size:12px;color:var(--mut);margin-top:8px}
/* modal, avisos */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal.on{display:flex}
#modal .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:440px;width:100%;max-height:85vh;overflow:auto;padding:16px}
.pick{display:flex;justify-content:space-between;align-items:center;padding:11px 10px;border-radius:8px;cursor:pointer}
.pick:hover{background:var(--panel2)}
.pick.cur{outline:1px solid var(--acc)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--acc);color:var(--onacc);font-weight:700;padding:10px 16px;border-radius:10px;z-index:60;display:none}
.upd{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top));z-index:70;background:var(--panel);border:1px solid var(--acc);border-radius:12px;padding:8px 8px 8px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.35);font-weight:600;max-width:94vw}
.form label{display:block;margin-bottom:10px}
.form input,.form select{width:100%;margin-top:4px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.chk{display:flex !important;align-items:center;gap:8px;text-transform:none;font-size:13px;color:var(--txt)}
.chk input{width:18px !important;height:18px;margin:0 !important;accent-color:var(--acc)}
/* editor de estadísticas */
.srow{display:grid;grid-template-columns:96px 1fr 30px 30px;gap:8px;align-items:center;padding:5px 0;font-size:13px}
.srow input[type=range]{width:100%;accent-color:var(--acc);height:26px;cursor:pointer}
.srow b{text-align:right;font:800 18px "Barlow Condensed";font-variant-numeric:tabular-nums}
.srow em{font-style:normal;font-size:11px;font-weight:700;text-align:right}
.istep{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);line-height:1.5}
.istep>span{flex:none;width:26px;height:26px;border-radius:50%;background:var(--acc);color:var(--onacc);font:800 15px/26px "Barlow Condensed";text-align:center}
.secth{margin:14px 0 6px;font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;font-family:Inter;font-weight:600}
/* ---------- VERSIÓN TELÉFONO ---------- */
@media(max-width:640px){
  body{font-size:14.5px}
  header{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--bg)} /* si no, la barra fija queda atrapada en el header */
  .hwrap{padding:calc(8px + env(safe-area-inset-top)) 12px 0;align-items:center;flex-wrap:nowrap;gap:8px}
  .brand h1{font-size:22px;white-space:nowrap}
  .brand p{display:none}
  .brand{padding-bottom:8px}
  .hact{margin:0 0 8px auto;gap:5px}
  .hact .btn{padding:6px 8px}
  nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--navbg);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);gap:0}
  nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px;padding:8px 2px 9px;border-bottom:0;border-top:3px solid transparent}
  nav button.on{border-color:var(--acc)}
  nav button i{display:block;font-size:19px;line-height:1.1}
  main{padding:12px 12px calc(84px + env(safe-area-inset-bottom))}
  .toast{bottom:calc(78px + env(safe-area-inset-bottom));max-width:92vw;text-align:center}
  .card{padding:13px;border-radius:12px}
  /* franja de resumen deslizable */
  .kpis{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:8px;margin:0 -12px 12px;padding:0 12px 2px;scrollbar-width:none}
  .kpis::-webkit-scrollbar{display:none}
  .kpis>.kpi{flex:0 0 40%;scroll-snap-align:start;padding:10px 12px}
  .kpi .v{font-size:26px}
  .row>.ctl{flex:1 1 140px}
  .row>.ctl select{width:100%}
  /* plantilla compacta: toca para desplegar */
  .pgrid{gap:8px}
  .pc{padding:10px 12px;cursor:pointer}
  .pc .ovr{font-size:34px}
  .pc h3{font-size:21px}
  .pc .meta{margin:2px 0 4px}
  .pc .chev{display:block;position:absolute;right:12px;top:14px;color:var(--mut);font-size:14px;transition:transform .2s}
  .pc.open .chev{transform:rotate(180deg)}
  .pc:not(.open) .body,.pc:not(.open) .desc,.pc:not(.open) .edit{display:none}
  .pc .edit{position:static;margin-top:10px;width:100%}
  .slot{width:70px}
  .slot .dot{width:42px;height:42px;font-size:18px}
  .slot .nm{font-size:12px;padding:2px 4px}
  .slot .rl{font-size:9px}
  .lines b{font-size:22px}
  .sug{flex-wrap:wrap}
  .sug .btn{width:100%}
  .bestnow{display:block;position:sticky;top:calc(46px + env(safe-area-inset-top));z-index:15;margin-bottom:12px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
  .bestnow .sug{margin:6px 0 0;background:var(--panel)}
  .sugall .sug:first-of-type{display:none}
  .erow{grid-template-columns:96px 1fr 40px}
  .erow input[type=range]{height:28px}
  #modal{align-items:flex-end;padding:0}
  #modal .box{max-width:none;border-radius:16px 16px 0 0;max-height:90vh;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
  .srow{grid-template-columns:84px 1fr 28px 28px}
  th,td{padding:6px 5px}
  .sbig b{font-size:44px}
  .sbig span{font-size:15px}
}
</style>
</head>
<body class="viewer">
<header><div class="hwrap">
  <div class="brand"><h1>Comfiar <span>F7</span></h1><p>Centro de mando · Torneo nacional · Cancha sintética</p></div>
  <nav id="nav">
    <button data-v="plantilla" class="on"><i>👥</i>Plantilla</button>
    <button data-v="ideal"><i>⚽</i>Alineación</button>
    <button data-v="cambios"><i>🔄</i>Cambios</button>
    <button data-v="torneo"><i>🏆</i>Torneo</button>
  </nav>
  <div class="hact"><button class="btn sm" id="install" hidden>📲 Instalar</button><button class="btn sm" id="thbtn" title="Modo claro / oscuro">☀️</button><button class="btn sm" id="dtbtn" hidden>🔒 DT</button></div>
</div></header>
<main>
  <section id="v-plantilla" class="on"></section>
  <section id="v-ideal"></section>
  <section id="v-cambios"></section>
  <section id="v-torneo"></section>
</main>
<div id="modal"></div>
<div class="toast" id="toast"></div>
<script id="state" type="application/json">{"matches":[],"lineup":null,"unavailable":[]}</script>
<script>
const PRISTINE = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
let S; try { S = JSON.parse(document.getElementById('state').textContent); } catch(e){ S = {}; }
function normS(){ S.matches=S.matches||[]; S.unavailable=S.unavailable||[]; S.stats=S.stats||{}; if(S.lineup===undefined) S.lineup=null;
  if(S.next===undefined) S.next=null; if(S.live===undefined) S.live=null; if(S.roster===undefined) S.roster=null; }
normS();
const plain = o => o===undefined ? null : JSON.parse(JSON.stringify(o));

/* ---------- DATOS: plantilla inicial (del Excel). Si el DT la edita, se usa S.roster ---------- */

const P = [];        // jugadores con las estadísticas editadas aplicadas (incluye dados de baja)
const BY = {};
let BASE = [];       // plantilla base (valores originales de cada jugador)
const E = {};        // energía en vivo (pestaña Cambios)
const ATTR = [['v','VEL'],['t','TIR'],['p','PAS'],['r','REG'],['d','DEF'],['f','FÍS']];
const ATTR_FULL = {v:'Velocidad',t:'Tiro',p:'Pase',r:'Regate',d:'Defensa',f:'Físico'};
const ROLE_NAME = {POR:'Arquero',DEF:'Defensa',MED:'Volante',DEL:'Delantero'};
const FIT = {
 'Arquero':{POR:1,DEF:.5,MED:.5,DEL:.5},
 'Defensa':{POR:.35,DEF:1,MED:.8,DEL:.6},
 'Mediocentro':{POR:.35,DEF:.9,MED:1,DEL:.85},
 'Alero':{POR:.35,DEF:.85,MED:1,DEL:.92},
 'Delantero':{POR:.35,DEF:.6,MED:.8,DEL:1},
 'Delantero / Arquero':{POR:.9,DEF:.6,MED:.8,DEL:1}
};
const W = {POR:{d:.5,f:.2,p:.15,v:.15},DEF:{d:.45,f:.2,v:.15,p:.15,r:.05},MED:{p:.3,r:.2,d:.15,f:.15,v:.1,t:.1},DEL:{t:.4,r:.2,v:.2,p:.1,f:.1}};
const MODES = {
 equilibrado:{label:'Equilibrado',m:{}},
 ofensivo:{label:'Ofensivo (hay que remontar)',m:{t:1.25,r:1.2,v:1.1,d:.75}},
 defensivo:{label:'Defensivo (cuidar el resultado)',m:{d:1.25,f:1.15,t:.8,r:.85}}
};
const FORMS = {'2-3-1':{DEF:2,MED:3,DEL:1},'3-2-1':{DEF:3,MED:2,DEL:1},'2-2-2':{DEF:2,MED:2,DEL:2},'3-1-2':{DEF:3,MED:1,DEL:2},'2-1-3':{DEF:2,MED:1,DEL:3}};
const MIN_VET = 2;
const VET = id => !!BY[id] && BY[id].e >= 40;
const isGK = p => p.pos==='Arquero';
const avgOvr = p => Math.round(ATTR.reduce((s,[k])=>s+(+p[k]||0),0)/ATTR.length*10)/10;
const ACT = () => P.filter(p=>!p.out);
const nm = id => BY[id] ? BY[id].n : '¿?';
const hasNum = p => p && p.num!==undefined && p.num!==null && p.num!=='';

function roleScore(p, role, mode){
  if(role==='POR' && isGK(p)) return p.ovr;
  const w = W[role], m = MODES[mode].m; let s=0, tw=0;
  for(const k in w){ const ww = w[k]*(m[k]||1); s += ww*p[k]; tw += ww; }
  return (s/tw) * (FIT[p.pos]||FIT['Mediocentro'])[role];
}
let RS = {};
function computeRS(){ RS={}; for(const mode in MODES){ RS[mode]={}; for(const p of P){ RS[mode][p.id]={}; for(const r of ['POR','DEF','MED','DEL']) RS[mode][p.id][r]=roleScore(p,r,mode); } } }
/* reconstruye P desde la plantilla base + estadísticas editadas (S.stats) */
function rebuild(){
  BASE = plain(S.roster && S.roster.length ? S.roster : DEFAULT_ROSTER);
  P.length = 0; for(const k in BY) delete BY[k];
  for(const b of BASE){ const p={...b}; const s=S.stats[p.id]; if(s){ Object.assign(p,s); if(!isGK(p)) p.ovr=avgOvr(p); } P.push(p); BY[p.id]=p; if(E[p.id]==null) E[p.id]=100; }
  computeRS();
}
rebuild();
const bestRole = (id,mode) => ['DEF','MED','DEL'].reduce((a,r)=>RS[mode][id][r]>RS[mode][id][a]?r:a,'DEF');

/* asignación óptima de 6 jugadores de campo a los cupos de una formación */
function assign(ids, counts, sc){
  let best = -1, bestA = null; const cur = {DEF:[],MED:[],DEL:[]}; const left = {...counts};
  (function rec(i, acc){
    if(i===ids.length){ if(acc>best){best=acc; bestA={DEF:[...cur.DEF],MED:[...cur.MED],DEL:[...cur.DEL]};} return; }
    for(const r of ['DEF','MED','DEL']) if(left[r]>0){ left[r]--; cur[r].push(ids[i]); rec(i+1, acc+sc(ids[i],r)); cur[r].pop(); left[r]++; }
  })(0,0);
  return {score:best, ...bestA};
}
function combos(arr,k){ const out=[]; const c=[]; (function rec(s){ if(c.length===k){out.push([...c]);return;} for(let i=s;i<=arr.length-(k-c.length);i++){c.push(arr[i]);rec(i+1);c.pop();} })(0); return out; }
function optimize(avail, formKey, mode){
  let best=null;
  const forms = formKey==='auto' ? Object.keys(FORMS) : [formKey];
  for(const fk of forms){
    for(const gk of avail){
      const rest = avail.filter(x=>x!==gk);
      for(const six of combos(rest,6)){
        const vets = (VET(gk)?1:0) + six.filter(VET).length;
        if(vets < MIN_VET) continue;
        const a = assign(six, FORMS[fk], (id,r)=>RS[mode][id][r]);
        const tot = a.score + RS[mode][gk].POR;
        if(!best || tot>best.tot) best = {tot, formation:fk, gk, DEF:a.DEF, MED:a.MED, DEL:a.DEL};
      }
    }
  }
  return best;
}
const onField = L => L ? [L.gk, ...L.DEF, ...L.MED, ...L.DEL].filter(Boolean) : [];
const roleOf = (L,id) => L.gk===id?'POR':['DEF','MED','DEL'].find(r=>L[r].includes(id));
const okLineup = L => !!L && onField(L).length===7 && onField(L).every(id=>BY[id]);
function teamScore(L, mode, En){
  const ids = onField(L); if(ids.length<7) return null;
  const eff = id => En ? (0.55 + 0.45*(En[id]??100)/100) : 1;
  return ids.reduce((s,id)=>s+RS[mode][id][roleOf(L,id)]*eff(id),0)/7;
}
function lineAvg(L, keys){ const ids=onField(L).filter(id=>L.gk!==id); if(!ids.length) return 0; return ids.reduce((s,id)=>s+keys.reduce((a,k)=>a+BY[id][k],0)/keys.length,0)/ids.length; }

let unavailable = new Set(S.unavailable);
let ATT = {};   // asistencia {id:{v:'si'|'no', m:clave del partido}}
function lastMatch(){ let b=null,bi=-1; S.matches.forEach((m,i)=>{ const f=m.fecha||''; if(!b || f>(b.fecha||'') || (f===(b.fecha||'') && i>bi)){ b=m; bi=i; } }); return b; }
function suspendedSet(){ const m=lastMatch(); if(!m) return new Set(); return new Set(Object.entries(m.pl||{}).filter(([,x])=>(+x.tr||0)>0 || (+x.ta||0)>=2).map(([id])=>id)); }
function attNoSet(){ if(!S.next) return new Set(); return new Set(Object.entries(ATT).filter(([,a])=>a.m===S.next.key && a.v==='no').map(([id])=>id)); }
function avail(){ const su=suspendedSet(), no=attNoSet(); return ACT().map(p=>p.id).filter(id=>!unavailable.has(id) && !su.has(id) && !no.has(id)); }

function radar(p, size=96){
  const c=size/2, R=c-12, n=6; const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n; return [c+Math.cos(a)*R*v/100, c+Math.sin(a)*R*v/100];};
  let g=''; for(const lv of [33,66,100]) g+=`<polygon points="${ATTR.map((_,i)=>pt(i,lv).join(',')).join(' ')}" style="fill:none;stroke:var(--line)"/>`;
  const poly = ATTR.map(([k],i)=>pt(i,p[k]).join(',')).join(' ');
  const lbl = ATTR.map(([k,l],i)=>{const [x,y]=pt(i,118);return `<text x="${x}" y="${y+3}" font-size="8" style="fill:var(--mut)" text-anchor="middle">${l}</text>`}).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${g}<polygon points="${poly}" style="fill:var(--acc);fill-opacity:.25;stroke:var(--acc);stroke-width:1.5"/>${lbl}</svg>`;
}

function fechaTxt(N){
  if(!N||!N.fecha) return '';
  const d=new Date(N.fecha+'T'+(N.hora||'12:00'));
  let s=d.toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'short'});
  if(N.hora) s+=' · '+d.toLocaleTimeString('es-CO',{hour:'numeric',minute:'2-digit'});
  return s.charAt(0).toUpperCase()+s.slice(1);
}

function startLive(){

function endLive(){

  modal(`<h3 style="margin:0 0 6px">Terminar partido</h3><div class="sbig"><span>Comfiar</span><b>${gf}</b><i>–</i><b>${gc}</b><span>${esc(S.live.rival)}</span></div>

  $('#lsave').onclick=()=>{

    for(const e of S.live.ev){ if(e.k==='g'){ if(e.id) g(e.id).g++; if(e.as) g(e.as).a++; } else if(e.k==='a') g(e.id).a++; else if(e.k==='y') g(e.id).ta++; else if(e.k==='r') g(e.id).tr++; }

function editPlayer(id){

    </div>
    <div class="secth">Estadísticas</div>
    <div id="erad" style="text-align:center;margin:4px 0">${radar(tmp,140)}</div>
    ${ATTR.map(([k])=>srow(k,ATTR_FULL[k])).join('')}
    <div id="govr" style="border-top:1px dashed var(--line);margin-top:6px;padding-top:6px;${pos==='Arquero'?'':'display:none'}">${srow('ovr','Puntaje arquero')}</div>
    <p class="note">${isNew?'Al guardar, estos serán sus valores originales.':'Los números de colores muestran la diferencia con sus valores originales.'}</p>

    document.querySelectorAll('#modal .srow').forEach(r=>{ const k=r.querySelector('input').dataset.k; r.querySelector('b').textContent=tmp[k]; r.querySelector('em').outerHTML=delta(k); });
  };
  document.querySelectorAll('#modal .srow input').forEach(inp=>inp.oninput=()=>{ tmp[inp.dataset.k]=+inp.value; refresh(); });
  $('#ppos').onchange=e=>{ pos=e.target.value; $('#govr').style.display=pos==='Arquero'?'':'none'; refresh(); };

    save(`${n} actualizado`,['roster','stats']);
  };
}

/* ---------- EQUIPO IDEAL (DT) / ALINEACIÓN (jugadores) ---------- */
let iForm='auto', iMode='equilibrado';
let IDEAL = okLineup(S.lineup) ? plain(S.lineup) : null;
function regen(){ const a=avail(); IDEAL = a.length>=7 ? optimize(a,iForm,iMode) : null; }
const Y = {POR:89,DEF:68,MED:44,DEL:19};
const XS = {1:[50],2:[30,70],3:[18,50,82]};
function pitchHTML(L, opts={}){
  const marks = `<div class="mk" style="left:-2px;right:-2px;top:50%;height:0;border-width:2px 0 0"></div>
    <div class="mk" style="left:50%;top:50%;width:22%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%)"></div>
    <div class="mk" style="left:25%;right:25%;bottom:-2px;height:14%;border-bottom:0"></div>
    <div class="mk" style="left:25%;right:25%;top:-2px;height:14%;border-top:0"></div>`;
  if(!L) return `<div class="pitch">${marks}</div>`;
  const F = FORMS[L.formation]; let slots='';
  const goals = {}; if(opts.live && S.live) S.live.ev.forEach(e=>{ if(e.k==='g'&&e.id) goals[e.id]=(goals[e.id]||0)+1; });
  const one = (id, role, x, y, key) => {
    const p = id?BY[id]:null; const e = opts.E && id ? (opts.E[id]??100) : null; const sc = p?Math.round(RS[opts.mode||'equilibrado'][id][role]):0;
    return `<div class="slot ${!p?'empty':''} ${p&&VET(id)?'vet':''}" style="left:${x}%;top:${y}%" data-key="${key}" data-id="${id||''}">
      <div class="dot">${p?(hasNum(p)?esc(p.num):sc):'+'}${p&&VET(id)?'<span class="vb">40+</span>':''}${goals[id]?`<span class="gb">⚽${goals[id]>1?goals[id]:''}</span>`:''}</div>
      <div class="nm">${p?esc(p.n):'Vacío'}</div><div class="rl">${ROLE_NAME[role]}${p&&hasNum(p)?' · '+sc:''}</div>
      ${e!=null?`<div class="en"><b style="width:${e}%;background:${col(e)}"></b></div>`:''}</div>`;
  };
  slots += one(L.gk,'POR',50,Y.POR,'gk');
  for(const r of ['DEF','MED','DEL']) for(let i=0;i<F[r];i++) slots += one(L[r][i],r,XS[F[r]][i],Y[r],r+':'+i);
  return `<div class="pitch">${marks}${slots}</div>`;
}
function ruleHTML(L){ const n = onField(L).filter(VET).length;
  return n>=MIN_VET ? `<div class="rule ok">✔ Regla 40+ cumplida: ${n} jugador${n>1?'es':''} de 40 o más en cancha</div>`
                    : `<div class="rule ko">✖ Regla 40+ incumplida: hay ${n} y se necesitan mínimo ${MIN_VET}</div>`; }

        ${bench.map(id=>{const r=bestRole(id,iMode);return `<tr><td>${esc(nm(id))} ${VET(id)?'<span class="tag t-vet">40+</span>':''}</td><td>${ROLE_NAME[r]}${BY[id].pos.includes('Arquero')?' / Arquero':''}</td><td class="n">${f1(Math.max(RS[iMode][id][r],BY[id].pos.includes('Arquero')?RS[iMode][id].POR:0))}</td></tr>`}).join('')||'<tr><td colspan="3" class="mut">Sin suplentes</td></tr>'}

  if(L){
    document.querySelectorAll('#v-ideal .slot').forEach(s=>s.onclick=()=>pickFor(s.dataset.key));
    $('#iuse').onclick=()=>{LIVE=plain(IDEAL); if(S.live){ syncPlayed(); save(null,['live']); } location.hash='cambios'; toast('Alineación cargada en Cambios');};
    $('#isave').onclick=()=>{S.lineup=plain(IDEAL); save('Alineación guardada',['lineup','unavailable']);};
    $('#ishare').onclick=()=>shareLineup(IDEAL, bench);

function renderAlineacion(){
  const enVivo = S.live && okLineup(S.live.lineup);
  const L = enVivo ? S.live.lineup : okLineup(S.lineup) ? S.lineup : null;
  const head = `${liveBannerHTML()}${nextCardHTML()}`;
  if(!L){ $('#v-ideal').innerHTML=`${head}<div class="card"><h3 style="margin:0 0 6px">Alineación</h3><p class="mut">${MODE==='cargando'?'Cargando…':'El DT todavía no ha publicado la alineación.'}</p></div>`; bindNext(); return; }
  const su=suspendedSet(), no=attNoSet();
  const bench=ACT().map(p=>p.id).filter(id=>!onField(L).includes(id) && !unavailable.has(id) && !su.has(id) && !no.has(id));
  const out=ACT().filter(p=>unavailable.has(p.id)||su.has(p.id)||no.has(p.id));

let cMode='equilibrado';
function liveSwap(L, outId, inId){
  const N = plain(L);
  if(N.gk===outId){ N.gk=inId; return N; }
  for(const r of ['DEF','MED','DEL']){ const ix=N[r].indexOf(outId); if(ix>=0) N[r][ix]=inId; }
  return N;
}
function reshuffle(N, mode){ // reacomoda a los 6 de campo en la mejor posición
  const six=[...N.DEF,...N.MED,...N.DEL];
  const a=assign(six, FORMS[N.formation], (id,r)=>RS[mode][id][r]*(0.55+0.45*(E[id]??100)/100));
  return {...N, DEF:a.DEF, MED:a.MED, DEL:a.DEL};
}
function suggest(L, mode){
  const base = teamScore(L,mode,E); const bench = avail().filter(id=>!onField(L).includes(id));
  const field = onField(L); const res=[];
  const evalN = (outs, ins) => {
    let N = L; outs.forEach((o,k)=>{ N = liveSwap(N,o,ins[k]); });
    if(onField(N).filter(VET).length<MIN_VET) return null;
    N = reshuffle(N,mode); return {N, outs, ins, d: teamScore(N,mode,E)-base};
  };
  for(const o of field) for(const i of bench){
    if(L.gk===o && RS[mode][i].POR < 50) continue; // al arco solo quien pueda atajar
    const r = evalN([o],[i]); if(r && r.d>0.05) res.push(r);
  }
  const doubles=[];
  for(const [o1,o2] of combos(field,2)) for(const [i1,i2] of combos(bench,2)){
    for(const ins of [[i1,i2],[i2,i1]]){
      if(L.gk===o1 && RS[mode][ins[0]].POR<50) continue; if(L.gk===o2 && RS[mode][ins[1]].POR<50) continue;
      const r=evalN([o1,o2],ins); if(r && r.d>0.05) doubles.push(r);
    }
  }
  const uniq = arr => { const seen=new Set(); return arr.sort((a,b)=>b.d-a.d).filter(x=>{const k=[...x.outs].sort()+'|'+[...x.ins].sort(); if(seen.has(k)) return false; seen.add(k); return true;}); };
  return {base, singles: uniq(res).slice(0,5), doubles: uniq(doubles).slice(0,3)};
}
function whyText(s, L){
  const parts = s.outs.map((o,k)=>{ const i=s.ins[k]; const ri = roleOf(s.N,i);
    let w=[]; if(E[o]<70) w.push(`${esc(nm(o))} está al ${E[o]}% de energía`);
    if(VET(o) && onField(L).filter(VET).length===MIN_VET) w.push('sale un 40+, así que entra otro 40+');
    if(cMode==='ofensivo' && ri!=='DEF' && BY[i].t>=70) w.push(`${esc(nm(i))} suma gol`);
    if(cMode==='defensivo' && BY[i].d>=70) w.push(`${esc(nm(i))} suma marca`);
    return w.join(' · '); }).filter(Boolean);
  const moved = onField(s.N).filter(id=>!s.ins.includes(id) && roleOf(L,id)!==roleOf(s.N,id));
  if(moved.length) parts.push('Reacomodo: '+moved.map(id=>`${esc(nm(id))} → ${ROLE_NAME[roleOf(s.N,id)]}`).join(', '));
  return parts.join(' · ');
}

    const row=s.closest('.mrow'); if(row && +b.dataset.d>0) row.querySelector('.tj').checked=true;
    const gf=$('#v-torneo [data-c="gf"]'); if(s.dataset.c==='g' && val(gf)<sumGoals()) setv(gf,sumGoals()); });
  document.querySelectorAll('#v-torneo input').forEach(i=>i.addEventListener('input',()=>formDirty=true));
  $('#tsave').onclick=()=>{
    const rival=$('#tr').value.trim(); if(!rival){ toast('Escribe el nombre del rival'); return; }
    const pl={}; document.querySelectorAll('#v-torneo .mrow').forEach(r=>{ const q=c=>val(r.querySelector(`[data-c="${c}"]`)); const j=r.querySelector('.tj').checked;
      const x={j:j?1:0,g:q('g'),a:q('a'),ta:q('ya'),tr:q('ro')}; if(x.j||x.g||x.a||x.ta||x.tr) pl[r.dataset.id]=x; });
    S.matches.push({rival, fecha:$('#td').value, gf:val($('#v-torneo [data-c="gf"]')), gc:val($('#v-torneo [data-c="gc"]')), pl});
    if(S.next && S.next.rival.toLowerCase()===rival.toLowerCase()) S.next=null;
    save('Partido guardado',['matches','next']); renderTorneo();
  };
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    const ix=+b.dataset.del;
    modal(`<h3 style="margin:0 0 8px">¿Borrar el partido vs ${esc(S.matches[ix].rival)}?</h3><p class="mut">No se puede deshacer.</p>
      <div class="row"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn pri" id="cdel">Borrar</button></div>`);
    $('#cdel').onclick=()=>{ S.matches.splice(ix,1); closeModal(); save('Partido borrado',['matches']); renderTorneo(); };
  });
  $('#tcopy').onclick=async()=>{ try{ await navigator.clipboard.writeText(JSON.stringify(S)); toast('Respaldo copiado'); }catch(e){ toast('No se pudo copiar'); } };
}
function scorers(m){ const g=Object.entries(m.pl||{}).filter(([,x])=>x.g>0).map(([id,x])=>esc(nm(id))+(x.g>1?' ×'+x.g:'')); return g.length?' · ⚽ '+g.join(', '):''; }

let ART=null;
function buildDoc(){
  const json = JSON.stringify(S).replace(/</g,'\\u003c');
  return PRISTINE.replace(/(<script id="state" type="application\/json">)[\s\S]*?(<\/script>)/, (_,a,b)=>a+json+b);
}

const FB_VER = '10.14.1';
// Correos que pueden editar. La protección real está en las reglas de Firestore (ver CLAUDE.md).
const EDITORS = ['elkin.cuadros97.ec@gmail.com'];
const ALL_KEYS = ['matches','lineup','unavailable','stats','roster','next','live'];
let MODE='cargando', FB=null, user=null, lastUpd=null, remoteExists=null;
const isDT = () => !!(user && EDITORS.includes(String(user.email||'').toLowerCase()));
const canEdit = () => MODE==='local' || isDT();
const cacheLocal = () => { try{ localStorage.setItem('comfiar_f7_state', JSON.stringify(S)); }catch(e){} };
function rerender(){
  if($('#modal').classList.contains('on')) return;                 // no interrumpir una ventana abierta
  if(VIEW==='torneo' && formDirty) return;                         // no borrar un partido a medio registrar
  if(VIEW==='cambios' && !canEdit()) return show('plantilla');

}
function syncNote(){
  if(MODE==='nube') return `☁️ ${isDT()?'Lo que guardes lo ven todos al instante.':'Datos del DT, se actualizan solos.'}${lastUpd?' Última actualización: '+lastUpd.toLocaleString('es-CO',{dateStyle:'medium',timeStyle:'short'})+'.':''}`;
  if(MODE==='cargando') return 'Conectando con la nube…';
  return ART ? 'Los datos se guardan en esta página.' : 'Sin conexión con la nube: los datos se guardan solo en este dispositivo.';
}
function updateRoleUI(){
  document.body.classList.toggle('viewer', !canEdit());
  const ideal=document.querySelector('#nav button[data-v="ideal"]');
  ideal.innerHTML = canEdit() ? '<i>⚽</i>Equipo ideal' : '<i>⚽</i>Alineación';
  const b=$('#dtbtn'); b.hidden = MODE!=='nube';
  b.textContent = isDT() ? '✓ DT' : user ? '👤' : '🔒 DT'; b.classList.toggle('on', isDT());
  rerender();
}
function applyRemote(d){
  S.matches=d.matches||[]; S.lineup=d.lineup||null; S.unavailable=d.unavailable||[]; S.stats=d.stats||{};
  S.roster=d.roster||null; S.next=d.next||null; S.live=d.live||null;
  unavailable=new Set(S.unavailable); rebuild();
  if(!canEdit() || !IDEAL) IDEAL = okLineup(S.lineup) ? plain(S.lineup) : null;
  if(canEdit() && S.live && okLineup(S.live.lineup) && !LIVE) LIVE=plain(S.live.lineup);
  lastUpd = d.updatedAt && d.updatedAt.toDate ? d.updatedAt.toDate() : null;
  cacheLocal();
}
async function initCloud(){
  if(!/^https?:$/.test(location.protocol) || window.claude){ MODE='local'; return updateRoleUI(); }
  try{
    const base=`https://www.gstatic.com/firebasejs/${FB_VER}/`;
    const [A,Au,F] = await Promise.all(['firebase-app.js','firebase-auth.js','firebase-firestore.js'].map(f=>import(base+f)));
    const app=A.initializeApp(FB_CONFIG);
    let db; try{ db=F.initializeFirestore(app,{localCache:F.persistentLocalCache()}); }catch(e){ db=F.getFirestore(app); }
    FB={Au,F,db,auth:Au.getAuth(app),ref:F.doc(db,'equipo','estado')};
    MODE='nube';
    Au.onAuthStateChanged(FB.auth, u=>{ user=u; updateRoleUI(); if(isDT() && remoteExists===false) save('Datos subidos a la nube'); });
    F.onSnapshot(FB.ref, snap=>{
      if(snap.metadata.hasPendingWrites) return; // es mi propio guardado
      remoteExists = snap.exists();
      if(remoteExists) applyRemote(snap.data());
      else if(isDT()) save('Datos subidos a la nube'); // primera vez: sube lo que el DT tenía guardado
      updateRoleUI();
    }, err=>{ console.warn('Firestore:', err.code||err); });
    F.onSnapshot(F.collection(db,'asistencia'), qs=>{ const a={}; qs.forEach(d=>a[d.id]=d.data()); ATT=a; rerender(); }, err=>console.warn('Asistencia:', err.code||err));
    updateRoleUI();
  }catch(e){ console.warn('Nube no disponible:', e); MODE='local'; updateRoleUI(); }
}
const AUTH_ERR = {'auth/invalid-credential':'Correo o contraseña incorrectos.','auth/wrong-password':'Correo o contraseña incorrectos.','auth/user-not-found':'Correo o contraseña incorrectos.','auth/invalid-email':'El correo no es válido.','auth/too-many-requests':'Demasiados intentos. Espera unos minutos.','auth/network-request-failed':'Sin conexión a internet.','auth/missing-password':'Escribe la contraseña.'};
function dtDialog(){

  $('#dform').onsubmit=async e=>{ e.preventDefault(); err('');

  $('#dreset').onclick=async()=>{ const m=$('#dmail').value.trim(); if(!m) return err('Escribe tu correo arriba y vuelve a tocar aquí.');

/* Guarda solo los campos indicados, para que dos dispositivos no se pisen los cambios.
   msg = null → guardado silencioso (sin aviso). */
async function save(msg, keys){
  keys = keys || ALL_KEYS;
  S.unavailable=[...unavailable];
  cacheLocal();
  if(MODE==='nube'){
    if(!isDT()){ toast('Solo el DT puede guardar cambios'); return; }
    const data={updatedAt:FB.F.serverTimestamp(), updatedBy:user.email}; keys.forEach(k=>data[k]=plain(S[k]));
    const fail = e => toast(e.code==='permission-denied'?'Sin permiso para guardar en la nube':'No se pudo guardar en la nube');
    FB.F.updateDoc(FB.ref, data).then(()=>{ remoteExists=true; }).catch(e=>{
      if(e.code==='not-found'){ const all={updatedAt:FB.F.serverTimestamp(), updatedBy:user.email}; ALL_KEYS.forEach(k=>all[k]=plain(S[k])); return FB.F.setDoc(FB.ref,all).then(()=>{ remoteExists=true; }).catch(fail); }
      fail(e);
    });
    if(msg) toast(msg+' · visible para todos'); return;
  }
  if(ART){ try{ await ART.publish(buildDoc()); if(msg) toast(msg); return; }
    catch(e){ const c=e&&(e.code||e.name||e.message)||''; if(String(c).includes('conflict')){ toast('Otra persona guardó al mismo tiempo; recargando'); return; }
      if(/not_granted|not_writer/.test(String(c))){ toast('Solo lectura: no puedes guardar cambios'); return; } } }
  if(msg) toast(msg+' (en este dispositivo)');
}

/* ---------- APP INSTALABLE (PWA: teléfono y PC) ---------- */
let installEvt=null;
function setupPWA(){
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  const web = /^https?:$/.test(location.protocol) && !window.claude;
  if(web && 'serviceWorker' in navigator){
    let had = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', ()=>{ if(had) showUpdate(); had=true; });
    navigator.serviceWorker.register('sw.js').then(reg=>{
      const check=()=>reg.update().catch(()=>{});
      document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') check(); });
      setInterval(check, 30*60*1000);
    }).catch(()=>{});
  }
  const b=$('#install'); if(!b || standalone || !web) return;
  b.hidden=false;
  window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); installEvt=e; });
  window.addEventListener('appinstalled',()=>{ b.hidden=true; toast('App instalada'); });
  b.onclick=async()=>{
    if(installEvt){ installEvt.prompt(); await installEvt.userChoice.catch(()=>{}); installEvt=null; return; }
    installGuide();
  };
}
function showUpdate(){
  if($('#upd')) return;
  const d=document.createElement('div'); d.className='upd'; d.id='upd';
  d.innerHTML='<span>✨ Hay una versión nueva de la app</span><button class="btn sm pri">Actualizar</button>';
  d.querySelector('button').onclick=()=>location.reload();
  document.body.appendChild(d);
}
const SHARE_IC = `<svg width="18" height="22" viewBox="0 0 18 22" style="vertical-align:-5px"><path d="M9 1v13M4.5 5.5 9 1l4.5 4.5" fill="none" stroke="#4da3ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 9H2.5v11.5h13V9H12" fill="none" stroke="#4da3ff" stroke-width="2" stroke-linejoin="round"/></svg>`;
const ADD_IC = `<svg width="20" height="20" viewBox="0 0 20 20" style="vertical-align:-4px"><rect x="1.5" y="1.5" width="17" height="17" rx="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M10 6v8M6 10h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`;
const step = (n, html) => `<div class="istep"><span>${n}</span><div>${html}</div></div>`;
function installGuide(UA = navigator.userAgent){
  const IOS = /iPhone|iPad|iPod/.test(UA) || (/Macintosh/.test(UA) && navigator.maxTouchPoints>1);
  const ANDROID = /Android/.test(UA);
  const INAPP = /FBAN|FBAV|Instagram|WhatsApp|Line\/|Snapchat|TikTok|MicroMessenger|GSA\//.test(UA);
  const link = location.href.split('#')[0];
  const copyBtn = `<button class="btn pri" style="width:100%;margin-top:10px" id="icopy">📋 Copiar enlace</button>`;
  let body;
  if(INAPP){
    body = `<div class="rule ko" style="margin-top:0">Estás viendo la app dentro de otra aplicación (WhatsApp, Instagram…). Desde aquí no se puede instalar.</div>
      ${step(1, IOS ? `Toca <b>···</b> o el ícono de brújula 🧭 y elige <b>“Abrir en Safari”</b>.` : `Toca <b>⋮</b> y elige <b>“Abrir en Chrome”</b>.`)}
      ${step(2, `Si no aparece esa opción, copia el enlace y pégalo en ${IOS?'<b>Safari</b>':'<b>Chrome</b>'}.`)}
      ${copyBtn}`;
  } else if(IOS){
    const chrome = /CriOS|EdgiOS|FxiOS/.test(UA);
    body = `${step(1, chrome
        ? `Toca el botón <b>Compartir</b> ${SHARE_IC} junto a la barra de direcciones.`
        : `Toca el botón <b>Compartir</b> ${SHARE_IC} de Safari (abajo; en iPad, arriba). Si no lo ves, toca <b>···</b> y luego <b>Compartir</b>.`)}
      ${step(2, `Desliza hacia abajo y toca <b>“Agregar a inicio”</b> ${ADD_IC}. Si no aparece, toca <b>“Ver más”</b>.`)}
      ${step(3, `Deja activado <b>“Abrir como app web”</b> y toca <b>Agregar</b>.`)}
      ${step(4, `Listo: abre <b>Comfiar F7</b> desde el ícono en tu pantalla de inicio.`)}
      <p class="note">Apple no permite instalar con un solo botón: este es el único camino en iPhone y iPad.${chrome?' Si no ves la opción, abre el enlace en Safari.':''}</p>`;
  } else if(ANDROID){
    body = `${step(1, `Abre el enlace en <b>Chrome</b>.`)}${step(2, `Toca el menú <b>⋮</b> (arriba a la derecha).`)}${step(3, `Elige <b>“Instalar app”</b> o <b>“Agregar a pantalla principal”</b>.`)}`;
  } else {
    body = `${step(1, `Abre el enlace en <b>Chrome</b> o <b>Edge</b>.`)}${step(2, `Haz clic en el icono de instalar ⊕ al final de la barra de direcciones, o en el menú → <b>“Instalar Comfiar F7”</b>.`)}
      <p class="note">¿Quieres instalarla en el celular? Abre este enlace desde el teléfono:<br><b style="word-break:break-all">${esc(link)}</b></p>${copyBtn}`;
  }
  modal(`<h3 style="margin:0 0 10px">Instalar Comfiar F7 ${IOS?'en tu iPhone':ANDROID?'en tu Android':''}</h3>${body}
    <p class="note">Una vez instalada se abre como una app aparte y funciona sin internet.</p>
    <button class="btn" style="width:100%;margin-top:8px" onclick="closeModal()">Entendido</button>`);
  const c=$('#icopy'); if(c) c.onclick=async()=>{ try{ await navigator.clipboard.writeText(link); toast('Enlace copiado'); }catch(e){ toast(link); } };
}
(function boot(){
  const empty = !S.matches.length && !S.lineup && !Object.keys(S.stats).length;
  if(empty){ try{ const ls=JSON.parse(localStorage.getItem('comfiar_f7_state')||'null'); if(ls){ S=ls; normS(); unavailable=new Set(S.unavailable);
    IDEAL=okLineup(S.lineup)?plain(S.lineup):null; LIVE=S.live&&okLineup(S.live.lineup)?plain(S.live.lineup):IDEAL?plain(IDEAL):null; } }catch(e){} }
  rebuild(); applyTheme();
  updateRoleUI(); show(location.hash.slice(1));
  setupPWA();
  $('#dtbtn').onclick=()=>FB&&dtDialog();
  initCloud();
  if(window.claude && typeof window.claude.use==='function'){
    window.claude.use('artifact').then(a=>{ ART=a; rerender(); }).catch(()=>{});
  }
})();
